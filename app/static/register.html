<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · InterioNote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    (function() {
      try {
        var t = localStorage.getItem('interionote.theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = (t === 'dark') || (t === 'system' && prefersDark);
        if (dark) document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
    // 이미 로그인된 상태면 홈으로 바로 이동
    (function() {
      try {
        var tok = localStorage.getItem('interionote.token');
        if (tok) {
          var p = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
          if (p.exp && Date.now()/1000 < p.exp) {
            window.location.replace('/');
          }
        }
      } catch(e) {}
    })();
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center py-8">

<div x-data="registerPage()" x-init="init()" class="w-full max-w-sm px-4">

  <!-- 로고 + 앱 이름 -->
  <div class="text-center mb-8">
    <div class="text-5xl mb-3">🏠</div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">InterioNote</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">인테리어 상담 기록 도우미</p>
  </div>

  <!-- 가입 신청 완료 화면 -->
  <div x-show="done" x-cloak
       class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-8 text-center">
    <div class="text-5xl mb-4">✅</div>
    <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-3">가입 신청 완료!</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-6">
      관리자 승인 후 로그인하실 수 있습니다.<br>
      승인이 완료되면 관리자가 알려드립니다.
    </p>
    <a href="/login"
       class="inline-block px-6 py-2.5 rounded-lg font-semibold text-white
              bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition">
      🔐 로그인 화면으로
    </a>
  </div>

  <!-- 회원가입 카드 -->
  <div x-show="!done"
       class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-8">

    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-1">회원가입 신청</h2>
    <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">
      관리자 승인 후 로그인이 가능합니다.
    </p>

    <!-- 에러 메시지 -->
    <div x-show="errorMsg" x-cloak
         class="mb-4 bg-red-50 dark:bg-red-900/30 border border-red-300 dark:border-red-700
                rounded-lg px-4 py-3 text-sm text-red-800 dark:text-red-300 flex items-start gap-2">
      <span class="shrink-0 mt-0.5">⚠</span>
      <span x-text="errorMsg"></span>
    </div>

    <form @submit.prevent="doRegister()" class="space-y-4">

      <!-- 아이디 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          아이디
          <span class="text-xs text-gray-400 dark:text-gray-500 font-normal ml-1">(영문·숫자·_ 2~30자)</span>
        </label>
        <input
          x-model="form.username"
          type="text"
          autocomplete="username"
          placeholder="예: user01"
          :disabled="loading"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition
                 disabled:opacity-60"
        />
      </div>

      <!-- 이름 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          이름 (표시 이름)
        </label>
        <input
          x-model="form.display_name"
          type="text"
          autocomplete="name"
          placeholder="예: 홍길동"
          :disabled="loading"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition
                 disabled:opacity-60"
        />
      </div>

      <!-- 비밀번호 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          비밀번호
          <span class="text-xs text-gray-400 dark:text-gray-500 font-normal ml-1">(4자 이상)</span>
        </label>
        <input
          x-model="form.password"
          type="password"
          autocomplete="new-password"
          placeholder="••••"
          :disabled="loading"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition
                 disabled:opacity-60"
        />
      </div>

      <!-- 비밀번호 확인 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          비밀번호 확인
        </label>
        <input
          x-model="form.confirm"
          type="password"
          autocomplete="new-password"
          placeholder="••••"
          :disabled="loading"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition
                 disabled:opacity-60"
        />
      </div>

      <!-- 가입 신청 버튼 -->
      <button
        type="submit"
        :disabled="loading || !form.username || !form.display_name || !form.password || !form.confirm"
        class="w-full py-2.5 rounded-lg font-semibold text-white transition
               bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800
               disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed">
        <span x-show="!loading">📝 가입 신청하기</span>
        <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/>
          </svg>
          신청 중...
        </span>
      </button>

    </form>

    <!-- 로그인 링크 -->
    <div class="mt-5 text-center text-sm text-gray-500 dark:text-gray-400">
      이미 계정이 있으신가요?
      <a href="/login" class="text-blue-600 dark:text-blue-400 hover:underline font-medium ml-1">로그인</a>
    </div>
  </div>

  <!-- 버전 표시 -->
  <div class="text-center mt-4 text-xs text-gray-400 dark:text-gray-600"
       x-text="appVersion ? 'v' + appVersion : ''"></div>

</div>

<script>
function registerPage() {
  return {
    form: { username: '', display_name: '', password: '', confirm: '' },
    loading: false,
    errorMsg: '',
    done: false,
    appVersion: '',

    async init() {
      try {
        const r = await fetch('/api/app/info');
        if (r.ok) {
          const d = await r.json();
          this.appVersion = d.version || '';
        }
      } catch(e) {}
    },

    async doRegister() {
      const { username, display_name, password, confirm } = this.form;
      if (!username || !display_name || !password || !confirm) return;

      // 클라이언트 측 유효성 검사
      if (!/^[a-zA-Z0-9_]{2,30}$/.test(username)) {
        this.errorMsg = '아이디는 영문·숫자·_ 2~30자로 입력해 주세요.';
        return;
      }
      if (password.length < 4) {
        this.errorMsg = '비밀번호는 4자 이상이어야 합니다.';
        return;
      }
      if (password !== confirm) {
        this.errorMsg = '비밀번호가 일치하지 않습니다.';
        return;
      }

      this.loading = true;
      this.errorMsg = '';
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, display_name, password }),
        });
        const data = await r.json();
        if (!r.ok) {
          this.errorMsg = data.detail || '가입 신청에 실패했습니다.';
          return;
        }
        this.done = true;
      } catch(e) {
        this.errorMsg = '서버 연결 오류: ' + e.message;
      } finally {
        this.loading = false;
      }
    },
  };
}
</script>

</body>
</html>
