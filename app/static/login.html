<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · InterioNote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    (function() {
      try {
        var t = localStorage.getItem('interionote.theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = (t === 'dark') || (t === 'system' && prefersDark);
        if (dark) document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
    // 이미 로그인된 상태면 홈으로 바로 이동
    (function() {
      try {
        var tok = localStorage.getItem('interionote.token');
        if (tok) {
          var p = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
          if (p.exp && Date.now()/1000 < p.exp) {
            window.location.replace('/');
          }
        }
      } catch(e) {}
    })();
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">

<div x-data="loginPage()" x-init="init()" class="w-full max-w-sm px-4">

  <!-- 로고 + 앱 이름 -->
  <div class="text-center mb-8">
    <div class="text-5xl mb-3">🏠</div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">InterioNote</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">인테리어 상담 기록 도우미</p>
  </div>

  <!-- 로그인 카드 -->
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-8">

    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">로그인</h2>

    <!-- 에러 메시지 -->
    <div x-show="errorMsg" x-cloak
         class="mb-4 bg-red-50 dark:bg-red-900/30 border border-red-300 dark:border-red-700 rounded-lg px-4 py-3 text-sm text-red-800 dark:text-red-300 flex items-start gap-2">
      <span class="shrink-0 mt-0.5">⚠</span>
      <span x-text="errorMsg"></span>
    </div>

    <form @submit.prevent="doLogin()" class="space-y-4">

      <!-- 아이디 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          아이디
        </label>
        <input
          x-model="username"
          type="text"
          autocomplete="username"
          placeholder="ID를 입력하세요"
          @keydown.enter="doLogin()"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                 transition"
          :disabled="loading"
        />
      </div>

      <!-- 비밀번호 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
          비밀번호
        </label>
        <input
          x-model="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••"
          @keydown.enter="doLogin()"
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder-gray-400 dark:placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                 transition"
          :disabled="loading"
          x-ref="pwdInput"
        />
      </div>

      <!-- v3.3.0 Phase 5: 아이디 저장 -->
      <div class="flex items-center gap-2">
        <input type="checkbox" id="saveId" x-model="saveId"
               class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer" />
        <label for="saveId" class="text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none">
          아이디 저장
        </label>
      </div>

      <!-- 로그인 버튼 -->
      <button
        type="submit"
        :disabled="loading || !username || !password"
        class="w-full py-2.5 rounded-lg font-semibold text-white transition
               bg-blue-600 hover:bg-blue-700 active:bg-blue-800
               disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed">
        <span x-show="!loading">🔐 로그인</span>
        <span x-show="loading" x-cloak class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/>
          </svg>
          로그인 중...
        </span>
      </button>

    </form>

    <!-- v3.3.0 Phase 5: 회원가입 링크 -->
    <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
      계정이 없으신가요?
      <a href="/register" class="text-blue-600 dark:text-blue-400 hover:underline font-medium ml-1">회원가입 신청</a>
    </div>
  </div>

  <!-- 버전 표시 -->
  <div class="text-center mt-4 text-xs text-gray-400 dark:text-gray-600" x-text="appVersion ? 'v' + appVersion : ''"></div>

</div>

<script>
function loginPage() {
  return {
    username: '',
    password: '',
    loading: false,
    errorMsg: '',
    appVersion: '',
    saveId: false,  // v3.3.0 Phase 5: 아이디 저장 체크박스

    async init() {
      // v3.3.0 Phase 5: 저장된 아이디 불러오기
      try {
        const saved = localStorage.getItem('interionote.saved_username');
        if (saved) {
          this.username = saved;
          this.saveId = true;
        }
      } catch(e) {}

      // 버전 정보 (인증 불필요 엔드포인트)
      try {
        const r = await fetch('/api/app/info');
        if (r.ok) {
          const d = await r.json();
          this.appVersion = d.version || '';
        }
      } catch(e) {}

      // 저장된 아이디 있으면 비밀번호 필드로, 없으면 아이디 필드로 포커스
      this.$nextTick(() => {
        if (this.username && this.$refs.pwdInput) {
          this.$refs.pwdInput.focus();
        } else {
          const el = document.querySelector('input[type="text"]');
          if (el) el.focus();
        }
      });
    },

    async doLogin() {
      if (!this.username || !this.password) return;
      this.loading = true;
      this.errorMsg = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password }),
        });
        const data = await r.json();
        if (!r.ok) {
          this.errorMsg = data.detail || '로그인에 실패했습니다.';
          return;
        }
        // v3.3.0 Phase 5: 아이디 저장/삭제
        try {
          if (this.saveId) {
            localStorage.setItem('interionote.saved_username', this.username);
          } else {
            localStorage.removeItem('interionote.saved_username');
          }
        } catch(e) {}
        // 토큰 + 사용자 정보 저장
        localStorage.setItem('interionote.token', data.token);
        localStorage.setItem('interionote.user', JSON.stringify({
          username: data.username,
          display_name: data.display_name,
          role: data.role,
        }));
        // 홈으로 이동
        window.location.replace('/');
      } catch(e) {
        this.errorMsg = '서버 연결 오류: ' + e.message;
      } finally {
        this.loading = false;
      }
    },
  };
}
</script>
</body>
</html>
